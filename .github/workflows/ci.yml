name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19

      - name: Install dependencies
        run: bun install

      - name: Install MCP dependencies
        working-directory: apps/mcp-server
        run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Security, concurrency and weekly review regressions
        run: bun run test:security

      - name: Bundled Worker API, smoke and MCP validation
        run: |
          bun run build:release
          bun run test:recovery
          bun run test:local --candidate
